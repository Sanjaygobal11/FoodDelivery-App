{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>
<body>

<h1>Checkout</h1>

<div class="checkout-box">

<h2>Your Order</h2>

{% for item in items %}
<p>
{{ item.food.name }}
x {{ item.quantity }}
= ₹{{ item.food.price }}
</p>
{% endfor %}

<h2>Total : ₹{{ total }}</h2>

<form method="POST">
{% csrf_token %}

<input type="text"
name="phone"
placeholder="Phone Number"
required>

<textarea
name="address"
placeholder="Delivery Address"
required></textarea>

<select name="payment">
    <option value="Cash on Delivery">
        Cash on Delivery
    </option>

    <option value="UPI">
        UPI
    </option>

    <option value="Card">
        Debit/Credit Card
    </option>
</select>

<button type="submit">
Place Order
</button>

</form>

</div>
</body>
</html>
